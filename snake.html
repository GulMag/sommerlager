<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE.EXE</title>
    <style>
        body { background: #c0c0c0; font-family: "Times New Roman", Times, serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .score-board { font-family: monospace; font-size: 14px; text-align: center; margin-bottom: 5px; color: #000; font-weight: bold; }
        canvas { background: #fff; display: block; margin: 0 auto; border: 2px solid #000; }
        .btn-game { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; font-family: "Times New Roman"; font-size: 14px; cursor: pointer; color: black; font-weight: bold; }
        .btn-game:active { border-color: #808080 #fff #fff #808080; }
    </style>
</head>
<body>

    <div class="score-board">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="210" height="210"></canvas>
    
    <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
        <button class="btn-game" id="startBtn" onclick="startGame()" style="padding:2px 10px;">Play</button>
        <button class="btn-game" id="stopBtn" onclick="stopGame()" style="padding:2px 10px;">Stop</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 15;
        let score = 0;
        let snake = [{x: 105, y: 105}, {x: 90, y: 105}, {x: 75, y: 105}];
        let dx = grid, dy = 0;
        let food = {x: 45, y: 45};
        let gameInterval = null;
        let isRunning = false;

        function gameLoop() {
            if (hasGameEnded()) { stopGame(); resetGame(); return; }
            clearCanvas(); drawFood(); moveSnake(); drawSnake();
        }

        function clearCanvas() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function drawSnake() { snake.forEach(part => { ctx.fillStyle = "#000"; ctx.fillRect(part.x, part.y, grid, grid); }); }
        function drawFood() { ctx.fillStyle = "#808080"; ctx.fillRect(food.x, food.y, grid, grid); }
        
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10; document.getElementById("score").innerHTML = score; generateFood();
            } else { snake.pop(); }
        }
        
        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width/grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height/grid)) * grid;
        }
        
        function hasGameEnded() {
            for(let i=4; i<snake.length; i++) { if(snake[i].x===snake[0].x && snake[i].y===snake[0].y) return true; }
            return snake[0].x<0 || snake[0].x>=canvas.width || snake[0].y<0 || snake[0].y>=canvas.height;
        }

        function startGame() { if(!isRunning) { gameInterval = setInterval(gameLoop, 120); isRunning = true; } }
        function stopGame() { clearInterval(gameInterval); isRunning = false; }
        function resetGame() { snake = [{x: 105, y: 105}, {x: 90, y: 105}, {x: 75, y: 105}]; dx = grid; dy = 0; score = 0; document.getElementById("score").innerHTML = score; clearCanvas(); drawSnake(); }

        document.addEventListener("keydown", e => {
            if(!isRunning) return;
            if (e.keyCode === 37 && dx === 0) { dx = -grid; dy = 0; }
            if (e.keyCode === 38 && dy === 0) { dx = 0; dy = -grid; }
            if (e.keyCode === 39 && dx === 0) { dx = grid; dy = 0; }
            if (e.keyCode === 40 && dy === 0) { dx = 0; dy = grid; }
        });
        clearCanvas(); drawSnake();
    </script>
</body>
</html>
