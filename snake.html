<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE.EXE</title>
    <style>
        body { background: #c0c0c0; font-family: "Times New Roman", Times, serif; margin: 0; padding: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .score-board { font-family: monospace; font-size: 13px; text-align: center; margin-bottom: 4px; color: #000; font-weight: bold; }
        
        /* Das breite Spielfeld */
        canvas { background: #fff; display: block; border: 2px solid #000; margin-bottom: 8px; }
        
        /* Die Kontroll-Leiste unter dem Spiel */
        .controls-row { display: flex; width: 220px; justify-content: space-between; align-items: center; }
        
        /* Linkes Drittel: Der kombinierte Action-Button */
        .action-area { width: 30%; display: flex; align-items: center; }
        .btn-action { width: 100%; height: 50px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; font-family: "Times New Roman"; font-size: 13px; font-weight: bold; cursor: pointer; }
        
        /* Rechtes Zwei-Drittel: Das Steuerkreuz */
        .dpad-area { width: 65%; display: flex; flex-direction: column; align-items: center; }
        .dpad-row { display: flex; gap: 4px; }
        
        .btn-game { background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; font-family: "Times New Roman"; font-size: 12px; cursor: pointer; color: black; font-weight: bold; width: 34px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0; }
        .btn-game:active, .btn-action:active { border-color: #808080 #fff #fff #808080; }
    </style>
</head>
<body>

    <!-- Level-Auswahl und Score-Anzeige -->
    <div class="top-bar">
        <div>SCOREQQQ: <span id="score">0</span></div>
        <div>LVL: <span id="levelDisplay">1</span></div>
    </div>
    
    <!-- 1) Der extrabreite Screen (Widescreen-Format) -->
    <canvas id="gameCanvas" width="220" height="140"></canvas>
    
    <!-- 2) Die Button-Sektion darunter -->
    <div class="controls-row">
        <!-- Links (1/3): Kombinierter Play/Pause Button -->
        <div class="action-area">
            <button class="btn-action" id="actionBtn" onclick="toggleGame()">Play</button>
        </div>
        
        <!-- Rechts (2/3): Die Richtungstasten -->
        <div class="dpad-area">
            <button class="btn-game" onclick="changeDir(0, -grid)" style="margin-bottom: 3px;">▲</button>
            <div class="dpad-row">
                <button class="btn-game" onclick="changeDir(-grid, 0)">◀</button>
                <button class="btn-game" onclick="changeDir(grid, 0)">▶</button>
            </div>
            <button class="btn-game" onclick="changeDir(0, grid)" style="margin-top: 3px;">▼</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const grid = 10; 
        let score = 0;
        let snake = [{x: 50, y: 50}, {x: 40, y: 50}, {x: 30, y: 50}];
        let dx = grid, dy = 0;
        let food = {x: 110, y: 50};
        let gameInterval = null;
        let isRunning = false;
        let gameSpeed = 150; // Standardgeschwindigkeit für Level 2
        let currentLevel = 1;

        function gameLoop() {
            if (hasGameEnded()) { 
                stopGame(); 
                resetGame(); 
                return; 
            }
            clearCanvas(); drawFood(); moveSnake(); drawSnake();
        }

        function clearCanvas() { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); }
        function drawSnake() { snake.forEach(part => { ctx.fillStyle = "#000"; ctx.fillRect(part.x, part.y, grid, grid); }); }
        function drawFood() { ctx.fillStyle = "#808080"; ctx.fillRect(food.x, food.y, grid, grid); }
        
        function moveSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                document.getElementById("score").innerHTML = score;
                generateFood();
                
                // NEU: Automatischer Level-Up alle 30 Punkte (3 Äpfel)
                if (score === 60 && currentLevel === 1) {
                    currentLevel = 2;
                    gameSpeed = 110; // Schneller!
                    updateSpeedLive();
                } else if (score === 100 && currentLevel === 2) {
                    currentLevel = 3;
                    gameSpeed = 70; // Extrem schnell!
                    updateSpeedLive();
                }
                
                // Textanzeige oben aktualisieren (falls du eine hast)
                if(document.getElementById("levelDisplay")) {
                    document.getElementById("levelDisplay").innerHTML = currentLevel;
                }
                
            } else {
                snake.pop();
            }
        }

        function updateSpeedLive() {
            if (isRunning) {
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
            }
        }
        
        function generateFood() {
            food.x = Math.floor(Math.random() * (canvas.width/grid)) * grid;
            food.y = Math.floor(Math.random() * (canvas.height/grid)) * grid;
        }
        
        function hasGameEnded() {
            for(let i=4; i<snake.length; i++) { if(snake[i].x===snake[0].x && snake[i].y===snake[0].y) return true; }
            return snake[0].x<0 || snake[0].x>=canvas.width || snake[0].y<0 || snake[0].y>=canvas.height;
        }

        function changeLevel() {
            const wasRunning = isRunning;
            if (wasRunning) stopGame(); // Spiel kurz stoppen
            gameSpeed = parseInt(document.getElementById("levelSelect").value); // Neuen Wert auslesen
            if (wasRunning) toggleGame(); // Spiel mit neuem Tempo weiterlaufen lassen
        }

        // Steuert den kombinierten Play/Pause Button
        function toggleGame() {
            const btn = document.getElementById("actionBtn");
            if (!isRunning) {
                gameInterval = setInterval(gameLoop, gameSpeed);
                isRunning = true;
                btn.innerHTML = "Pause";
            } else {
                stopGame();
            }
        }

        function stopGame() {
            clearInterval(gameInterval);
            isRunning = false;
            document.getElementById("actionBtn").innerHTML = "Play";
        }


        function resetGame() { 
            snake = [{x: 50, y: 50}, {x: 40, y: 50}, {x: 30, y: 50}]; 
            dx = grid; dy = 0; 
            score = 0; 
            currentLevel = 1; // Zurück auf Anfang
            gameSpeed = 150;   // Zurück auf Anfang
            document.getElementById("score").innerHTML = score; 
            if(document.getElementById("levelDisplay")) {
                document.getElementById("levelDisplay").innerHTML = currentLevel;
            }
            clearCanvas(); drawSnake(); 
        }

        function changeDir(newDx, newDy) {
            if (!isRunning) return;
            if (newDx !== 0 && dx === 0) { dx = newDx; dy = 0; }
            if (newDy !== 0 && dy === 0) { dx = 0; dy = newDy; }
        }

        document.addEventListener("keydown", e => {
            if(!isRunning && e.keyCode !== 32) return; // Spacebar erlaubt Start am PC
            if (e.keyCode === 32) { toggleGame(); }
            if (e.keyCode === 37) changeDir(-grid, 0);
            if (e.keyCode === 38) changeDir(0, -grid);
            if (e.keyCode === 39) changeDir(grid, 0);
            if (e.keyCode === 40) changeDir(0, grid);
        });
        clearCanvas(); drawSnake();
    </script>
</body>
</html>
